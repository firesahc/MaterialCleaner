plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk rootProject.ext.compileSdk
    defaultConfig {
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
    }
    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }
    namespace 'me.gm.cleaner.platform.hiddenapi'
    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java/stub', 'src/main/java/bridge', 'src/main/java/api']
            }
        }
    }
}

dependencies {
    compileOnly project(':core:ipc-contract')
    implementation "androidx.annotation:annotation:$rootProject.annotationVersion"
    implementation "androidx.core:core-ktx:$rootProject.coreVersion"
}
