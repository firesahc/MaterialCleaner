plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk rootProject.ext.compileSdk
    buildToolsVersion = rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion
    defaultConfig {
        applicationId 'me.gm.cleaner'
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        multiDexEnabled true
        resourceConfigurations += ['en', 'zh-rCN', 'zh-rTW']
        externalNativeBuild.cmake {
            arguments '-DANDROID_STL=none'
            cFlags ''
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "Cleaner_${defaultConfig.versionName}-${variant.buildType.name}.apk"
        }
    }
    buildTypes {
        debug {
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // android.buildTypes.release.ndk.debugSymbolLevel = { SYMBOL_TABLE | FULL }
            ndk.debugSymbolLevel = 'full'
        }
    }
    // Instead, use the bundle block to control which types of configuration APKs
    // you want your app bundle to support.
    bundle {
        language {
            // Specifies that the app bundle should not support
            // configuration APKs for language resources. These
            // resources are instead packaged with each base and
            // feature APK.
            enableSplit = false
        }
        density {
            // This property is set to true by default.
            enableSplit = true
        }
        abi {
            // This property is set to true by default.
            enableSplit = true
        }
    }
    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }
    buildFeatures {
        dataBinding true
        viewBinding true
        prefab true
        buildConfig true
    }

    externalNativeBuild.cmake {
        path 'src/main/cpp/CMakeLists.txt'
        version '3.22.1'
    }
    packagingOptions.resources {
        excludes += ['/META-INF/**', '/kotlin/**', '/org/**', '/okhttp3/**']
    }
    // https://developer.android.com/reference/tools/gradle-api/4.1/com/android/build/api/dsl/LintOptions
    lint {
        checkReleaseBuilds false
    }
    namespace 'me.gm.cleaner'
}

// ── Xposed 模块 main.jar 自动构建 ──────────────────────────────────
// 将 MediaProvider Hook runtime 及必要依赖通过 d8 转为 DEX，打包为 main.jar，
// 输出到 build/generated/xposed/<variant>/ 并经由 Variant API 注册为
// generated assets，随 mergeAssets 自动打进 APK。
// 要点：不写源码目录（git 干净）；不猜任务名（无 whenTaskAdded）；
// 按 variant 取 classes.jar（release 不再错配 debug 类）。
// 任务名 buildXposedMainJar（debug）被 CI 锚点门禁直接引用，保持不变。
// ─────────────────────────────────────────────────────────────────
def registerXposedMainJar(String variant) {
    def capitalized = variant.substring(0, 1).toUpperCase() + variant.substring(1)
    def taskName = variant == 'debug' ? 'buildXposedMainJar' : "buildXposedMainJar${capitalized}"
    // 模块清单单一真源来自根项目 xposedRuntimeModules
    def xposedRuntimeModules = rootProject.ext.xposedRuntimeModules
    def sdkDir = android.sdkDirectory
    def androidJar = "${sdkDir}/platforms/android-${android.compileSdk}/android.jar"
    // 普通 File 声明输出（outputs.file 保持与原实现相同的声明方式）
    def outJarFile = new File(project.buildDir, "generated/xposed/${variant}/main.jar")
    // AGP 要求 wiredWith 返回 DirectoryProperty：用懒属性承载输出目录
    def outDirProp = objects.directoryProperty()
    outDirProp.set(layout.buildDirectory.dir("generated/xposed/${variant}"))
    return tasks.register(taskName) {
        description = "构建 Xposed 模块 main.jar（${variant}，d8 + zip）"
        group = 'Cleaner'

        // 依赖 Hook runtime 及 main.jar 必要依赖编译完成（按 variant）
        dependsOn ":runtime:media-provider-hook:sync${capitalized}LibJars"
        dependsOn xposedRuntimeModules.collect { it + ":sync${capitalized}LibJars" }

        // 输入：Hook runtime 及必要依赖 classes.jar（按 variant）
        def mainJarInputs = ([project(':runtime:media-provider-hook')] +
                xposedRuntimeModules.collect { project(it) }).collect { module ->
            module.buildDir.path + "/intermediates/aar_main_jar/${variant}/classes.jar"
        }
        inputs.files mainJarInputs
        // 锚点类清单变更必须使门禁失效重跑
        inputs.property('xposedRuntimeAnchorClasses') {
            rootProject.ext.xposedRuntimeAnchorClasses.toString()
        }
        outputs.file outJarFile

        doLast {
            def mainJarInputFiles = mainJarInputs.collect { file(it) }
            def missingInput = mainJarInputFiles.find { !it.exists() }
            if (missingInput != null) {
                throw new GradleException("main.jar 输入 classes.jar 未找到: ${missingInput.path}")
            }

            // 定位 d8 工具
            def buildToolsDir = "${sdkDir}/build-tools/${android.buildToolsVersion}"
            def d8 = new File(buildToolsDir, 'd8')
            if (!d8.exists()) {
                d8 = new File(buildToolsDir, 'd8.bat')
            }
            if (!d8.exists()) {
                throw new GradleException("d8 未找到: ${buildToolsDir}")
            }

            // 临时目录
            def tmpDir = layout.buildDirectory.dir('tmp/mainjar').get().asFile
            delete tmpDir
            tmpDir.mkdirs()
            def dexDir = new File(tmpDir, 'dex')
            dexDir.mkdirs()

            // Step 1: d8 将 classes.jar 转为 DEX
            exec {
                commandLine d8.path,
                        '--lib', androidJar,
                        '--min-api', '26',
                        '--output', dexDir.path,
                        *mainJarInputFiles.collect { it.path }
            }

            def dexFile = new File(dexDir, 'classes.dex')
            if (!dexFile.exists()) {
                throw new GradleException("d8 转换失败，classes.dex 未生成")
            }

            // Step 2: 将 classes.dex 打包为 main.jar（输出到 build 目录）
            def outDirFile = outDirProp.get().asFile
            outDirFile.mkdirs()
            def outputFile = new File(outDirFile, 'main.jar')
            outputFile.delete()

            outputFile.withOutputStream { out ->
                def zipOut = new java.util.zip.ZipOutputStream(out)
                zipOut.putNextEntry(new java.util.zip.ZipEntry('classes.dex'))
                zipOut << dexFile.bytes
                zipOut.closeEntry()
                zipOut.close()
            }

            if (outputFile.exists()) {
                logger.lifecycle("✅ main.jar 已生成: ${outputFile.path} (${outputFile.size()} 字节)")
            } else {
                throw new GradleException("main.jar 生成失败")
            }

            // ── Step 3: CI 门禁——随行模块锚点类断言 ──
            // 逐模块校验标志性类已进入 DEX，防止打包清单漂移导致
            // Hook 进程 NoClassDefFoundError 整体失效（该故障发生在
            // 运行时可观测体系生效之前，必须在构建期拦截）。
            def dexFiles = dexDir.listFiles().findAll { it.name.endsWith('.dex') }
            if (dexFiles.isEmpty()) {
                throw new GradleException("main.jar 门禁失败：DEX 文件不存在")
            }
            def dexBuffer = new java.io.ByteArrayOutputStream()
            dexFiles.each { dexBuffer.write(it.bytes) }
            def dexText = new String(dexBuffer.toByteArray(), java.nio.charset.StandardCharsets.US_ASCII)
            def anchorClasses = rootProject.ext.xposedRuntimeAnchorClasses as Map
            def missingAnchors = anchorClasses
                    .findAll { module, anchor -> !dexText.contains(anchor) }
            if (!missingAnchors.isEmpty()) {
                def detail = missingAnchors.collect { module, anchor ->
                    "${module} 缺少锚点类 ${anchor}"
                }.join('; ')
                throw new GradleException("main.jar 门禁失败：${detail}。" +
                        "请核对根项目 xposedRuntimeModules 清单与对应模块的实现依赖。")
            }
            logger.lifecycle("✅ main.jar 门禁通过: ${anchorClasses.size()} 个随行模块锚点类全部就位")
        }
    }
}

def debugMainJarTask = registerXposedMainJar('debug')
def releaseMainJarTask = registerXposedMainJar('release')

// 经由 Variant API 把生成目录注册为 assets：mergeAssets 自动消费，
// 不再按任务名字符串挂接（删除 whenTaskAdded 猜测）。
// 显式接线：AGP 在脚本求值之后才创建 variant 任务，直接 named() 会
// “任务不存在”；改用 matching + configureEach 延迟到任务具现时挂接。
// 名字是 AGP 稳定契约里的精确全称（非前后缀通配）：未来若更名，
// 这里的精确匹配自然失效为“无接线”，而 merge 任务输入指纹会因缺失
// main.jar 导致 APK 体积断言失败——fail-loud，不静默。
// 生成目录同时声明为对应 variant 的 assets srcDir，保证增量指纹正确。
def debugAssets = android.sourceSets.debug.assets
debugAssets.srcDir layout.buildDirectory.dir('generated/xposed/debug')
def releaseAssets = android.sourceSets.release.assets
releaseAssets.srcDir layout.buildDirectory.dir('generated/xposed/release')
tasks.matching { it.name == 'mergeDebugAssets' }.configureEach {
    dependsOn debugMainJarTask
}
tasks.matching { it.name == 'mergeReleaseAssets' }.configureEach {
    dependsOn releaseMainJarTask
}

dependencies {
    implementation project(':core:ipc-contract')
    implementation project(':core:common')
    implementation project(':core:config-store')
    implementation project(':core:storage-redirect-domain')
    implementation project(':runtime:media-provider-hook')
    runtimeOnly project(':runtime:cleaner-server')
    implementation project(':shared')
    compileOnly files('libs/api-82.jar')

    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation "androidx.core:core-ktx:$rootProject.coreVersion"
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$rootProject.lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$rootProject.lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$rootProject.lifecycleVersion"
    implementation "androidx.navigation:navigation-fragment-ktx:$rootProject.navigationVersion"
    implementation "androidx.navigation:navigation-ui-ktx:$rootProject.navigationVersion"
    implementation "androidx.preference:preference-ktx:$rootProject.preferenceVersion"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    def libsuVersion = '5.2.2'
    implementation "com.github.topjohnwu.libsu:core:$libsuVersion"
    implementation "com.github.topjohnwu.libsu:service:$libsuVersion"
    implementation 'com.google.android.material:material:1.11.0'
    implementation "com.google.guava:guava:$rootProject.guavaVersion"
    implementation 'com.takisoft.preferencex:preferencex-colorpicker:1.1.0'
    implementation 'dev.rikka.rikkax.preference:simplemenu-preference:1.0.3'
    implementation 'dev.rikka.ndk.thirdparty:cxx:1.2.0'
    def kotlinxCoroutinesVersion = rootProject.kotlinxCoroutinesVersion
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinxCoroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    implementation 'org.yaml:snakeyaml:1.33:android'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20220320'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
