plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk rootProject.ext.compileSdk
    defaultConfig {
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        buildConfigField 'int', 'VERSION_CODE', "${rootProject.ext.versionCode}"
    }
    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }
    namespace 'me.gm.cleaner.runtime.server'
    buildFeatures { buildConfig true }
}

dependencies {
    implementation project(':core:ipc-contract')
    implementation project(':core:config-store')
    implementation project(':core:storage-redirect-domain')
    implementation project(':core:storage-redirect-databus')
    implementation project(':platform:hidden-api')
    implementation project(':shared')
    compileOnly files('../../app/libs/api-82.jar')

    implementation "androidx.annotation:annotation:$rootProject.annotationVersion"
    implementation "androidx.core:core-ktx:$rootProject.coreVersion"
    def roomVersion = '2.6.1'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"
    implementation "com.google.guava:guava:$rootProject.guavaVersion"
}
